<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duromac Monitor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1>🚛 Duromac Truck Monitor</h1>
      <nav class="topnav">
        <a href="{{ url_for('index') }}">Live</a>
        <a href="{{ url_for('clarity_history') }}">Clarity history</a>
        <a href="{{ url_for('outage_history') }}">Outages</a>
        <a href="{{ url_for('logs_page') }}">Logs</a>
      </nav>
    </div>
    {% block header_toolbar %}{% endblock %}
  </header>

  {% block banners %}<div id="banners">{% include "_banners.html" %}</div>{% endblock %}

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
