<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duromac Monitor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <h1>🚛 Duromac Truck Monitor</h1>
    <nav class="tabs">
      <a class="tab {{ 'active' if active == 'live' else '' }}" href="{{ url_for('index') }}">Live Status</a>
      <a class="tab {{ 'active' if active == 'report' else '' }}" href="{{ url_for('daily_report') }}">Daily Report</a>
    </nav>
  </header>

  <div id="banners">{% include "_banners.html" %}</div>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
